<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>YouSafer | ABM Experience</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><script>tailwind.config={theme:{extend:{colors:{ysBlue:'#002D91',ysBlue2:'#0647C9',ysGreen:'#00E482',ysInk:'#071A38',ysSoft:'#EEF6FF',ysIce:'#DCEFFF'},fontFamily:{sans:['Inter','system-ui']},boxShadow:{soft:'0 30px 90px rgba(0,45,145,.16)',neon:'0 0 70px rgba(0,228,130,.36)',card:'0 35px 100px rgba(13,76,134,.22)'}}}}</script><style>body{margin:0;font-family:Inter,system-ui;background:#d9eafa;overflow-x:hidden}button,a{cursor:pointer}.home.hidden{display:none}.route{display:none}.route.active{display:block}.heroWord{position:absolute;left:-3vw;right:-3vw;top:0;text-align:center;font-size:clamp(6rem,17vw,18rem);font-weight:900;letter-spacing:-.09em;line-height:.72;color:rgba(255,255,255,.48);pointer-events:none}.fade{opacity:0;transform:translateY(24px);animation:fade .8s ease forwards}@keyframes fade{to{opacity:1;transform:none}}.float{animation:float 6s ease-in-out infinite}@keyframes float{50%{transform:translateY(-20px) rotate(1.5deg)}}.card{background:rgba(255,255,255,.78);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.72);box-shadow:0 28px 80px rgba(0,45,145,.13)}.tilt{transition:.3s cubic-bezier(.2,.8,.2,1)}.tilt:hover{transform:translateY(-10px) scale(1.012)}.brand-logo{width:min(320px,56vw);height:auto}.phone{width:260px;height:510px;border-radius:48px;border:10px solid #0c1830;background:radial-gradient(circle at 70% 20%,#8ed8ff,transparent 25%),linear-gradient(155deg,#051a3d,#0d58dd 55%,#b7f5e2);box-shadow:0 50px 110px rgba(0,45,145,.32);position:relative;overflow:hidden}.phone:before{content:'';position:absolute;inset:24px 18px auto;height:62px;border-radius:22px;background:rgba(255,255,255,.18)}.phone:after{content:'YouSafer Saúde';position:absolute;left:20px;right:20px;bottom:28px;border-radius:28px;background:white;color:#002D91;text-align:center;padding:18px;font-weight:900}.miniapp{position:absolute;border-radius:22px;background:white;color:#123d66;padding:14px 18px;box-shadow:0 18px 50px rgba(0,45,145,.16);font-weight:800}.pill{border-radius:999px;background:white;padding:.85rem 1.2rem;box-shadow:0 18px 50px rgba(0,45,145,.13);font-weight:900;color:#002D91}.mascot-img{width:min(330px,78vw);height:auto;filter:drop-shadow(0 34px 60px rgba(0,45,145,.25))}.mascot-small{width:min(240px,64vw);height:auto;filter:drop-shadow(0 28px 50px rgba(0,45,145,.2))}.orb{position:absolute;border-radius:50%;filter:blur(35px);opacity:.35}.chip{display:inline-flex;align-items:center;gap:.5rem;border-radius:999px;background:#fff;padding:.55rem 1rem;font-size:.78rem;font-weight:900;color:#002D91;box-shadow:0 16px 40px rgba(0,45,145,.12)}.route section{position:relative}</style></head><body><main id="home" class="home"><section class="relative min-h-screen overflow-hidden bg-gradient-to-br from-[#a9cfe9] via-[#e9f6ff] to-[#c7e9ff]"><div class="heroWord">YOUSAFER</div><div class="orb bg-ysGreen w-80 h-80 top-28 right-20 float"></div><div class="orb bg-ysBlue w-96 h-96 bottom-0 left-10 float"></div><div class="absolute top-8 left-8 z-10"><svg class="brand-logo" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg"><g fill="#00E482"><circle cx="82" cy="31" r="25"/><circle cx="82" cy="149" r="25"/><path d="M19 61c20-22 37-21 53 2l10 14 10-14c16-23 33-24 53-2 14 15 14 35 0 51-20 22-37 21-53-2l-10-14-10 14c-16 23-33 24-53 2-14-16-14-36 0-51z"/></g><text x="205" y="126" font-family="Inter,Arial" font-size="92" font-weight="500" fill="#002D91">You<tspan font-weight="900">Safer</tspan></text></svg></div><div class="max-w-7xl mx-auto px-6 min-h-screen grid lg:grid-cols-[.85fr_1.15fr] gap-12 items-center relative z-10"><div class="fade"><span class="chip">ABM EXPERIENCE PARA ISPs</span><h1 class="mt-8 text-5xl sm:text-7xl font-black tracking-[-.08em] leading-[.88] text-white drop-shadow">Selecione a persona e abra a landing.</h1><p class="mt-6 text-xl text-[#123d66]/80 max-w-xl">Uma página matriz em formato de slide. Cada botão leva para uma experiência própria de convencimento da YouSafer.</p></div><div class="relative h-[720px] fade"><div class="absolute left-1/2 top-28 -translate-x-1/2"><img class="mascot-img float" src="/1%20(4)(2).png" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="phone float" style="display:none"></div></div><div class="miniapp left-0 top-28">Retenção<br><span class="text-xs text-slate-500">valor mensal</span></div><div class="miniapp right-0 top-48">SVA Saúde<br><span class="text-xs text-slate-500">uso real</span></div><div class="miniapp left-8 bottom-44">ISP<br><span class="text-xs text-slate-500">sem guerra de preço</span></div><div class="miniapp right-12 bottom-28">WhatsApp<br><span class="text-xs text-slate-500">jornada simples</span></div></div></div><div class="absolute bottom-8 left-0 right-0 z-20"><div id="selector" class="max-w-6xl mx-auto px-6 grid grid-cols-2 md:grid-cols-5 gap-3"></div></div></section></main><section id="route" class="route"></section><script>const mascots=['/1%20(4)(2).png','/2%20(6)(2).png','/3%20(3)(2).png','/4%20(6)(2).png','/5%20(4)(2).png'];const data={ceo:{m:0,t:'CEO / Dono do Provedor',tag:'Margem e crescimento',h:'Você não precisa ganhar no menor preço. Precisa fazer sua base enxergar mais valor.',p:'Você sabe que desconto segura hoje e destrói margem amanhã. A YouSafer entra como SVA de saúde para defender receita, aumentar valor percebido e criar uma narrativa de cuidado que o concorrente não copia em um dia.',cards:['Proteja margem sem virar refém de desconto','Dê ao cliente um motivo real para ficar','Crie diferenciação difícil de copiar','Transforme saúde em defesa de receita'],metric:'Menos guerra de preço. Mais valor percebido.'},comercial:{m:1,t:'Comercial / Growth',tag:'Venda sem desconto',h:'Pare de vender só mega, preço e instalação. Venda valor que o cliente entende.',p:'Você precisa de um argumento que abra conversa. Com a YouSafer, seu ISP adiciona saúde à proposta e transforma a venda em algo maior que conexão.',cards:['Mais argumento para fechar','Menos dependência de desconto','Campanhas de upgrade mais fortes','Diferenciação clara contra ISPs parecidos'],metric:'A oferta deixa de ser só internet.'},cs:{m:2,t:'CS / Retenção',tag:'Engajamento da base',h:'Seu cliente só lembra do provedor no boleto ou no suporte? Isso precisa mudar.',p:'Você precisa aparecer de forma positiva na rotina da base. A YouSafer cria um benefício percebido no dia a dia, aumentando vínculo, utilidade e permanência.',cards:['Mais motivos para permanecer','Benefício útil fora do suporte','Comunicação de cuidado com a base','Campanhas de retenção mais relevantes'],metric:'Retenção começa antes do pedido de cancelamento.'},financeiro:{m:3,t:'Financeiro / ROI',tag:'Receita preservada',h:'A melhor receita é aquela que você deixa de perder todos os meses.',p:'Churn corrói caixa, aquisição e previsibilidade. A YouSafer ajuda você a defender receita recorrente com uma camada de valor percebido antes que a comparação vire preço.',cards:['Proteção de receita recorrente','Menos CAC perdido substituindo clientes','Mais previsibilidade de base','Tese clara de custo versus churn'],metric:'Cada ponto de churn evitado preserva caixa.'},tecnico:{m:4,t:'Técnico / Integração',tag:'Implantação simples',h:'Um SVA só escala se não virar complexidade para operação.',p:'Você precisa de uma solução que o cliente entenda e a operação consiga sustentar. A YouSafer prioriza jornada simples, comunicação clara e ativação guiada.',cards:['Jornada simples para usuário final','Menos fricção operacional','Ativação comunicável','Uso real, não só item no contrato'],metric:'Simples para o ISP. Claro para o cliente.'}};const sel=document.getElementById('selector');Object.entries(data).forEach(([id,x])=>sel.innerHTML+=`<button onclick="openRoute('${id}')" class="pill tilt text-xs md:text-sm">${x.t}</button>`);function openRoute(id){const x=data[id];document.getElementById('home').classList.add('hidden');const r=document.getElementById('route');r.classList.add('active');r.innerHTML=`<section class="min-h-screen overflow-hidden bg-gradient-to-br from-[#a8cfe9] via-[#ecf7ff] to-[#d7edff] text-[#123d66]"><div class="heroWord">${x.tag.toUpperCase()}</div><button onclick="goHome()" class="fixed top-6 left-6 z-50 pill">← Voltar</button><div class="absolute top-6 right-6 z-40 hidden md:block"><svg width="210" viewBox="0 0 900 180" xmlns="http://www.w3.org/2000/svg"><g fill="#00E482"><circle cx="82" cy="31" r="25"/><circle cx="82" cy="149" r="25"/><path d="M19 61c20-22 37-21 53 2l10 14 10-14c16-23 33-24 53-2 14 15 14 35 0 51-20 22-37 21-53-2l-10-14-10 14c-16 23-33 24-53 2-14-16-14-36 0-51z"/></g><text x="205" y="126" font-family="Inter,Arial" font-size="92" font-weight="500" fill="#002D91">You<tspan font-weight="900">Safer</tspan></text></svg></div><div class="max-w-7xl mx-auto px-6 pt-28 pb-16 relative z-10"><div class="card rounded-[3.3rem] p-6 md:p-10"><div class="grid lg:grid-cols-[.9fr_1.1fr] gap-10 items-center"><div><span class="chip">${x.t}</span><h1 class="mt-8 text-5xl md:text-7xl font-black tracking-[-.08em] leading-[.9] text-white drop-shadow">${x.h}</h1><p class="mt-6 text-xl text-[#123d66]/80">${x.p}</p><a href="#form" class="mt-8 inline-flex rounded-full bg-ysBlue text-white px-7 py-4 font-black">Quero avançar →</a></div><div class="relative min-h-[590px]"><div class="absolute left-1/2 top-4 -translate-x-1/2"><img class="mascot-img float" src="${mascots[x.m]}" onerror="this.style.display='none'"></div><div class="miniapp right-0 top-20">${x.metric}<br><span class="text-xs text-slate-500">YouSafer</span></div><div class="miniapp left-0 bottom-16">@YouSafer<br><span class="text-xs text-slate-500">SVA de Saúde</span></div></div></div></div><div class="mt-10 grid md:grid-cols-4 gap-5">${x.cards.map((c,i)=>`<article class="card tilt p-7"><span class="text-ysGreen font-black">0${i+1}</span><h3 class="mt-5 text-2xl font-black text-ysBlue">${c}</h3></article>`).join('')}</div><section class="mt-16 grid lg:grid-cols-3 gap-6"><div class="card p-8 lg:col-span-2"><h2 class="text-4xl font-black text-ysBlue">A narrativa muda em três movimentos</h2><div class="mt-8 grid md:grid-cols-3 gap-4"><p><b>1.</b><br>Você sai da comparação rasa de preço.</p><p><b>2.</b><br>Você adiciona saúde como utilidade real.</p><p><b>3.</b><br>Você fortalece retenção e valor percebido.</p></div></div><div class="card p-8"><h3 class="text-3xl font-black text-ysBlue">Mais que SVA.</h3><p class="mt-4 text-slate-600">Uma tese comercial para o seu provedor competir melhor.</p><img class="mascot-small mt-6 mx-auto" src="${mascots[(x.m+1)%5]}" onerror="this.style.display='none'"></div></section><section id="form" class="mt-16 card p-8"><h2 class="text-4xl font-black text-ysBlue">Vamos adaptar para o seu ISP?</h2><form class="mt-8 grid md:grid-cols-2 gap-4"><input class="h-14 rounded-2xl px-5 bg-ysSoft" placeholder="Nome"><input class="h-14 rounded-2xl px-5 bg-ysSoft" placeholder="E-mail"><input class="h-14 rounded-2xl px-5 bg-ysSoft" placeholder="Telefone"><input class="h-14 rounded-2xl px-5 bg-ysSoft" placeholder="Empresa / ISP"><input class="h-14 rounded-2xl px-5 bg-ysSoft" placeholder="Quantidade de assinantes"><button class="h-14 rounded-full bg-ysGreen text-ysBlue font-black">Quero diagnóstico</button></form></section></div></section>`;scrollTo(0,0);history.pushState(null,'','#'+id)}function goHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('route').classList.remove('active');document.getElementById('route').innerHTML='';history.pushState(null,'','#home');scrollTo(0,0)}addEventListener('load',()=>{let id=location.hash.replace('#','');if(data[id])openRoute(id)});</script></body></html>
