<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>YouSafer | ABM Personas</title><script src="https://cdn.tailwindcss.com"></script><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"><script>tailwind.config={theme:{extend:{colors:{ysBlue:'#002D91',ysBlue2:'#0647C9',ysGreen:'#00E482',ysDark:'#07101F',ysSoft:'#EEF6FF'},fontFamily:{sans:['Inter','system-ui']},boxShadow:{soft:'0 30px 90px rgba(0,45,145,.18)',neon:'0 0 60px rgba(0,228,130,.32)'}}}}</script><style>body{margin:0;font-family:Inter,system-ui;background:#dbeaf7;overflow-x:hidden}.home.hidden{display:none}.route{display:none}.route.active{display:block}.fade{opacity:0;transform:translateY(24px);animation:in .8s ease forwards}@keyframes in{to{opacity:1;transform:none}}.float{animation:f 6s ease-in-out infinite}@keyframes f{50%{transform:translateY(-18px) rotate(2deg)}}.glass{background:rgba(255,255,255,.72);backdrop-filter:blur(18px)}.bigword{position:absolute;inset:2rem 0 auto 0;text-align:center;font-size:clamp(5rem,16vw,16rem);font-weight:900;letter-spacing:-.08em;color:rgba(255,255,255,.38);line-height:.75;pointer-events:none}.phone{width:250px;height:500px;border-radius:44px;background:linear-gradient(150deg,#061a3d,#0b6df5 55%,#9bd4ff);box-shadow:0 40px 90px rgba(0,45,145,.35);border:10px solid #07101f;position:relative}.phone:after{content:'YouSafer';position:absolute;left:22px;right:22px;bottom:28px;padding:18px;border-radius:26px;background:rgba(255,255,255,.88);color:#002D91;font-weight:900;text-align:center}.pill{border-radius:999px;background:white;padding:.8rem 1.2rem;box-shadow:0 18px 50px rgba(0,45,145,.13);font-weight:800}.card{border-radius:2rem;background:white;box-shadow:0 25px 70px rgba(0,45,145,.12)}.tilt{transition:.28s}.tilt:hover{transform:translateY(-8px) scale(1.01)}.mascot{width:190px;height:260px;border-radius:44% 44% 28% 28%;background:linear-gradient(#fff,#dfeaff);position:relative;overflow:hidden}.mascot:before{content:'';position:absolute;left:50%;top:30px;width:70px;height:70px;background:#ffd0b7;border-radius:50%;transform:translateX(-50%);box-shadow:-40px 24px 0 -20px #08245b,40px 24px 0 -20px #08245b}.mascot:after{content:'';position:absolute;left:30px;right:30px;bottom:0;height:140px;border-radius:46% 46% 0 0;background:linear-gradient(135deg,#002D91,#0647C9)}.ribbon{position:absolute;transform:rotate(-10deg);background:#eef6ff;border-radius:999px;padding:.8rem 1.3rem;font-weight:900;color:#123d66;box-shadow:0 15px 40px rgba(0,45,145,.14)}.gridfx{background-image:linear-gradient(rgba(0,45,145,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(0,45,145,.06) 1px,transparent 1px);background-size:56px 56px}</style></head><body><main id="home" class="home"><section class="relative min-h-screen overflow-hidden bg-gradient-to-br from-[#bcdaf0] via-[#eaf5ff] to-[#c9e3f7]"><div class="bigword">YOUSAFER</div><div class="absolute top-8 left-8 z-10 flex items-center gap-3"><div class="w-12 h-12 rounded-2xl bg-ysGreen"></div><b class="text-2xl text-ysBlue">YouSafer</b></div><div class="max-w-7xl mx-auto px-6 min-h-screen grid lg:grid-cols-[.9fr_1.1fr] gap-12 items-center relative z-10"><div class="fade"><span class="pill text-ysBlue">Página matriz ABM</span><h1 class="mt-8 text-5xl sm:text-7xl font-black tracking-[-.075em] leading-[.88] text-white drop-shadow">Escolha a persona. Abra a experiência.</h1><p class="mt-6 text-xl text-[#123d66]/80 max-w-xl">Uma home em formato de slide para apresentar as landings ABM da YouSafer para provedores de internet.</p></div><div class="relative h-[720px] fade"><div class="absolute left-1/2 top-20 -translate-x-1/2 phone float"></div><div class="ribbon left-0 top-56">CEO / Dono</div><div class="ribbon right-0 top-40 rotate-6">Comercial</div><div class="ribbon left-10 bottom-40 rotate-3">CS / Retenção</div><div class="ribbon right-12 bottom-52 -rotate-6">Financeiro</div><div class="ribbon left-1/2 bottom-20 -translate-x-1/2">Técnico</div></div></div><div class="absolute bottom-8 left-0 right-0 z-20"><div id="selector" class="max-w-5xl mx-auto px-6 grid grid-cols-2 md:grid-cols-5 gap-3"></div></div></section></main><section id="route" class="route"></section><script>const data={ceo:{t:'CEO / Dono do Provedor',tag:'Margem e crescimento',h:'Você não precisa ganhar no menor preço. Precisa fazer sua base enxergar mais valor.',p:'Como dono de ISP, você sente a pressão do desconto todos os meses. A YouSafer entra como SVA de saúde para transformar cuidado em diferenciação, retenção e defesa de margem.',cards:['Proteja margem sem virar refém de desconto','Crie um diferencial difícil de copiar','Dê ao cliente um motivo real para ficar','Associe sua marca a cuidado e utilidade'],cta:'Quero proteger minha base'},comercial:{t:'Comercial / Growth',tag:'Venda sem desconto',h:'Venda mais que internet. Venda um plano com valor percebido.',p:'Seu time já fala de velocidade, estabilidade e instalação. Com a YouSafer, você adiciona saúde à proposta e muda a conversa de preço para benefício real.',cards:['Mais argumento para fechar','Menos dependência de desconto','Campanhas de upgrade mais fortes','Diferenciação clara contra ISPs parecidos'],cta:'Quero uma oferta mais forte'},cs:{t:'CS / Retenção',tag:'Engajamento da base',h:'Seu cliente só lembra do provedor no boleto ou no suporte? Isso precisa mudar.',p:'Retenção nasce quando a base percebe valor no relacionamento. A YouSafer ajuda você a aparecer de forma positiva na rotina do cliente com um benefício de saúde simples de usar.',cards:['Mais motivos para permanecer','Benefício útil no dia a dia','Comunicação de cuidado','Campanhas de retenção mais relevantes'],cta:'Quero reter com valor'},financeiro:{t:'Financeiro / ROI',tag:'Receita preservada',h:'A melhor receita é aquela que você deixa de perder todos os meses.',p:'Churn corrói caixa, aquisição e previsibilidade. A YouSafer ajuda você a defender receita recorrente criando valor percebido antes que o cliente compare só preço.',cards:['Proteção de receita recorrente','Menos CAC perdido','Mais previsibilidade de base','Tese clara de custo versus churn'],cta:'Quero avaliar o ROI'},tecnico:{t:'Técnico / Integração',tag:'Implantação simples',h:'Um SVA só escala se não virar complexidade para operação.',p:'A YouSafer precisa ser fácil para o ISP e simples para o cliente final. A jornada via WhatsApp e a ativação guiada reduzem fricção e tornam o uso mais claro.',cards:['Jornada simples para usuário final','Menos fricção operacional','Ativação comunicável','Uso real, não só item no contrato'],cta:'Quero entender a implantação'}};const sel=document.getElementById('selector');Object.entries(data).forEach(([id,x])=>sel.innerHTML+=`<button onclick="openRoute('${id}')" class="pill tilt text-xs md:text-sm text-ysBlue">${x.t}</button>`);function openRoute(id){const x=data[id];document.getElementById('home').classList.add('hidden');const r=document.getElementById('route');r.classList.add('active');r.innerHTML=`<section class="min-h-screen bg-[#dbeaf7] text-[#123d66] relative overflow-hidden"><div class="bigword">${x.tag.toUpperCase()}</div><button onclick="goHome()" class="fixed top-6 left-6 z-50 pill text-ysBlue">← Voltar</button><div class="max-w-7xl mx-auto px-6 pt-28 pb-16 relative z-10"><div class="glass rounded-[3rem] p-6 md:p-10 shadow-soft"><div class="grid lg:grid-cols-[.9fr_1.1fr] gap-10 items-center"><div><span class="pill text-ysBlue">${x.t}</span><h1 class="mt-8 text-5xl md:text-7xl font-black tracking-[-.075em] leading-[.9] text-white drop-shadow">${x.h}</h1><p class="mt-6 text-xl text-[#123d66]/80">${x.p}</p><a href="#form" class="mt-8 inline-flex rounded-full bg-ysBlue text-white px-7 py-4 font-black">${x.cta} →</a></div><div class="relative min-h-[560px]"><div class="absolute left-1/2 top-8 -translate-x-1/2 phone float"></div><div class="absolute right-0 top-10 card p-5 flex gap-3 items-center"><div class="w-14 h-14 rounded-full bg-ysGreen"></div><b>@YouSafer<br><span class="text-sm font-medium text-slate-500">SVA de Saúde</span></b></div><div class="absolute left-0 bottom-10 card p-5 w-56"><b>ISP conectado</b><p class="text-sm text-slate-500 mt-2">saúde + retenção + valor percebido</p></div></div></div></div><div class="mt-8 grid md:grid-cols-4 gap-5">${x.cards.map((c,i)=>`<div class="card tilt p-7"><span class="text-ysGreen font-black">0${i+1}</span><h3 class="mt-5 text-2xl font-black text-ysBlue">${c}</h3></div>`).join('')}</div><section class="mt-16 grid lg:grid-cols-2 gap-8 items-center"><div class="card p-8"><h2 class="text-4xl font-black text-ysBlue">Como a YouSafer entra na sua operação</h2><div class="mt-8 grid gap-4"><p><b>1.</b> Mapeia a dor da base e a narrativa da sua oferta.</p><p><b>2.</b> Posiciona saúde como SVA de valor percebido.</p><p><b>3.</b> Ajuda seu time a comunicar retenção, cuidado e diferenciação.</p></div></div><div class="card p-8 flex justify-center"><div class="mascot float"></div></div></section><section id="form" class="mt-16 card p-8"><h2 class="text-4xl font-black text-ysBlue">Vamos adaptar para o seu provedor?</h2><form class="mt-8 grid md:grid-cols-2 gap-4"><input class="h-14 rounded-2xl px-5 bg-ysSoft" placeholder="Nome"><input class="h-14 rounded-2xl px-5 bg-ysSoft" placeholder="E-mail"><input class="h-14 rounded-2xl px-5 bg-ysSoft" placeholder="Telefone"><input class="h-14 rounded-2xl px-5 bg-ysSoft" placeholder="Empresa / ISP"><input class="h-14 rounded-2xl px-5 bg-ysSoft" placeholder="Quantidade de assinantes"><button class="h-14 rounded-full bg-ysGreen text-ysBlue font-black">Quero diagnóstico</button></form></section></div></section>`;scrollTo(0,0);history.pushState(null,'','#'+id)}function goHome(){document.getElementById('home').classList.remove('hidden');document.getElementById('route').classList.remove('active');document.getElementById('route').innerHTML='';history.pushState(null,'','#home');scrollTo(0,0)}addEventListener('load',()=>{let id=location.hash.replace('#','');if(data[id])openRoute(id)});</script></body></html>
